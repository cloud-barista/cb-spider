<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        .dash-item { position: relative; }
        .mini-dash-pop {
            display: none; position: absolute; top: 2px; right: 2px; z-index: 2;
            font-size: 10px; font-weight: 600; line-height: 1; padding: 3px 5px; border-radius: 9px;
            border: 1px solid #7dd3fc; background: #e0f2fe; color: #0369a1; cursor: pointer;
        }
        .mini-dash-pop:hover { background: #bae6fd; }
        .dash-item:hover .mini-dash-pop { display: block; }
        .mini-dash-pop.on { display: block; background: #0369a1; color: #fff; border-color: #0369a1; }
        .menu-item {
            margin: 0; /* Remove margin between menu items */
            padding: 5px 2px; /* compact: reduced horizontal padding, slightly larger vertical spacing */
            font-size: 12px;
            font-weight: bold;
            color: #0645AD;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }
        .menu-item:hover {
            background-color: #f0f0f0;
        }
        .menu-item img {
            vertical-align: middle;
            height: 28px; /* compact icon size */
            width: auto; /* Maintain aspect ratio */
        }
        .logo img {
            margin-top: 0;
            margin-bottom: 0;
            height: 40px;
            width: auto; /* Maintain aspect ratio */
        }
        .menu-text {
            margin-top: 0; /* Remove or minimize the top margin */
            text-align: center;
            font-size: 11px;
            line-height: 1.15;
            white-space: nowrap;
        }
        .text-menu {
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            margin: -10px 0 0 0;
            color: #0645AD;
            cursor: pointer;
        }
        .text-menu:hover {
            text-decoration: underline;
        }
        .menu-selected {
            background-color: #e8f0fe;
            border-left: 3px solid #0645AD;
        }
        .divider {
            width: 80%;
            height: 1px;
            background-color: #666; /* Change color to a darker shade */
            margin: 3px auto; /* compact: separate the divider and center it */
        }
    </style>
    <script>
        function checkConnectionAndRedirect(menu, event) {
            const topMenuFrame = parent.document.querySelector('.top-menu');
            const connectionNameElement = topMenuFrame ? topMenuFrame.querySelector('#selectedConfigName') : null;
            const connectionName = connectionNameElement ? connectionNameElement.innerText.replace('Connection Name: ', '') : '';
            // main.html marks "no connection selected" with data-noconn (the shown text varies by page)
            const noConnection = !connectionName || (connectionNameElement && connectionNameElement.dataset.noconn === '1');
            if (noConnection && menu !== 'topology') {
                alert('Please select a connection first.');
                event.preventDefault();
                return;
            }

            const menuUrlMap = {
                vpc: "/spider/adminweb/vpc",
                securitygroup: "/spider/adminweb/securitygroup",
                keypair: "/spider/adminweb/keypair",
                vm: "/spider/adminweb/vm",
                disk: "/spider/adminweb/disk",
                myimage: "/spider/adminweb/myimage",
                nlb: "/spider/adminweb/nlb",
                publicip: "/spider/adminweb/publicip",
                nic: "/spider/adminweb/nic",
                cluster: "/spider/adminweb/cluster",
                s3: "/spider/adminweb/s3",
                filesystem: "/spider/adminweb/filesystem",
                rdbms: "/spider/adminweb/rdbms",
                topology: "/spider/adminweb/topology"
            };

            // Topology without a selected connection: all-connections view (connections with resources)
            const targetUrl = noConnection
                ? '/spider/adminweb/topology-all'
                : `${menuUrlMap[menu]}/${encodeURIComponent(connectionName)}`;
            const iframe = parent.frames['body_frame'];

            // Show progress bar
            parent.postMessage({ type: 'showProgressBar' }, '*');

            iframe.onload = function() {
                parent.postMessage({ type: 'iframeLoaded' }, '*');
            };
            iframe.onerror = function() {
                parent.postMessage({ type: 'hideProgressBar' }, '*');
                alert('Failed to load the page. Please try again.');
            };

            iframe.location.href = targetUrl;

            // Change selected image
            changeSelectedImage(menu);
            // Notify main.html to deselect its menus
            parent.postMessage({ type: 'deselectMainMenu' }, '*');
        }

        function selectLeftMenu(menu) {
            changeSelectedImage(menu);
            const menuUrlMap = {
                dashboard: "/spider/adminweb/dashboard",
                connection: "/spider/adminweb/connectionconfig"
            };

            const targetUrl = menuUrlMap[menu];
            const iframe = parent.frames['body_frame'];

            if (targetUrl) {
                // Show progress bar
                parent.postMessage({ type: 'showProgressBar' }, '*');

                iframe.onload = function() {
                    parent.postMessage({ type: 'iframeLoaded' }, '*');
                };
                iframe.onerror = function() {
                    parent.postMessage({ type: 'hideProgressBar' }, '*');
                    alert('Failed to load the page. Please try again.');
                };

                iframe.location.href = targetUrl;
            }

            // Notify main.html to deselect its menus
            parent.postMessage({ type: 'deselectMainMenu' }, '*');
        }

        // Menus without dedicated icons → map to an existing base icon
        const menuIconBase = {
            'nic':      'disk',
            'publicip': 'disk',
            'rdbms':    'disk',
            'topology': 'vpc',
            'filesystem': 'filesystem'
        };
        function getIconBase(menu) {
            return menuIconBase[menu] || menu;
        }

        function changeSelectedImage(selectedMenu) {
            const menus = ['dashboard', 'connection', 'vpc', 'securitygroup', 'keypair', 'vm', 'publicip', 'nic', 'disk', 'myimage', 'nlb', 'cluster', 's3', 'filesystem', 'rdbms', 'topology'];
            menus.forEach(menu => {
                const imgElement = document.getElementById(menu + '-img');
                const menuEl    = imgElement ? imgElement.closest('.menu-item') : null;
                if (imgElement) {
                    const base = getIconBase(menu);
                    if (menu === selectedMenu) {
                        imgElement.src = `./images/left-menu/${base}_selected.png`;
                        if (menuEl) menuEl.classList.add('menu-selected');
                    } else {
                        imgElement.src = `./images/left-menu/${base}.png`;
                        if (menuEl) menuEl.classList.remove('menu-selected');
                    }
                }
            });
        }

        window.addEventListener('message', function(event) {
            if (event.data.type === 'deselectLeftMenu') {
                const menus = ['dashboard', 'connection', 'vpc', 'securitygroup', 'keypair', 'vm', 'publicip', 'nic', 'disk', 'myimage', 'nlb', 'cluster', 's3', 'filesystem', 'rdbms', 'topology'];
                menus.forEach(menu => {
                    const imgElement = document.getElementById(menu + '-img');
                    const menuEl    = imgElement ? imgElement.closest('.menu-item') : null;
                    if (imgElement) {
                        imgElement.src = `./images/left-menu/${getIconBase(menu)}.png`;
                        if (menuEl) menuEl.classList.remove('menu-selected');
                    }
                });
            }
        });
    </script>
</head>
<body>
    <a href="/spider/adminweb" target="_top" class="menu-item logo" onclick="sessionStorage.setItem('skipAbout', 'true');">
        <img src="./images/logo.png" border="0">
    </a>
    <div class="divider"></div> <!-- Divider after logo -->
    <div class="menu-item dash-item" onclick="selectLeftMenu('dashboard')">
        <img id="dashboard-img" src="./images/left-menu/dashboard.png" alt="Dashboard Icon">
        <div class="menu-text">Dashboard</div>
        <!-- shown on hover (and while open): floating Mini Dashboard over any page -->
        <button id="miniDashToggle" class="mini-dash-pop" type="button"
                onclick="event.stopPropagation(); parent.toggleMiniDash && parent.toggleMiniDash();"
                title="Mini Dashboard: a floating Dashboard that stays over other menus">⧉ Mini</button>
    </div>
    <div class="menu-item" onclick="selectLeftMenu('connection')">
        <img id="connection-img" src="./images/left-menu/connection.png" alt="Connection Icon">
        <div class="menu-text">Connection</div>
    </div>
    <div class="divider"></div> <!-- Divider after Connection -->
    <div class="menu-item" onclick="checkConnectionAndRedirect('vpc', event)">
        <img id="vpc-img" src="./images/left-menu/vpc.png" alt="VPC/Subnet Icon">
        <div class="menu-text">VPC/Subnet</div>
    </div>
    <div class="menu-item" onclick="checkConnectionAndRedirect('securitygroup', event)">
        <img id="securitygroup-img" src="./images/left-menu/securitygroup.png" alt="SecurityGroup Icon">
        <div class="menu-text">SecurityGroup</div>
    </div>
    <div class="menu-item" onclick="checkConnectionAndRedirect('keypair', event)">
        <img id="keypair-img" src="./images/left-menu/keypair.png" alt="KeyPair Icon">
        <div class="menu-text">KeyPair</div>
    </div>
    <div class="divider"></div> <!-- Divider after Keypair -->
    <div class="menu-item" onclick="checkConnectionAndRedirect('vm', event)">
        <img id="vm-img" src="./images/left-menu/vm.png" alt="VM Icon">
        <div class="menu-text">VM</div>
    </div>
    <div class="menu-item" onclick="checkConnectionAndRedirect('nic', event)">
        <img id="nic-img" src="./images/left-menu/disk.png" alt="NIC Icon" onerror="this.src='./images/left-menu/disk.png'">
        <div class="menu-text">NIC (WIP)</div>
    </div>
    <div class="menu-item" onclick="checkConnectionAndRedirect('publicip', event)">
        <img id="publicip-img" src="./images/left-menu/disk.png" alt="PublicIP Icon">
        <div class="menu-text">PublicIP (WIP)</div>
    </div>
    <div class="menu-item" onclick="checkConnectionAndRedirect('disk', event)">
        <img id="disk-img" src="./images/left-menu/disk.png" alt="Disk Icon">
        <div class="menu-text">Disk</div>
    </div>
    <div class="menu-item" onclick="checkConnectionAndRedirect('myimage', event)">
        <img id="myimage-img" src="./images/left-menu/myimage.png" alt="MyImage Icon">
        <div class="menu-text">MyImage</div>
    </div>
    <div class="menu-item" onclick="checkConnectionAndRedirect('nlb', event)">
        <img id="nlb-img" src="./images/left-menu/nlb.png" alt="NLB Icon">
        <div class="menu-text">NLB</div>
    </div>
    <div class="divider"></div> <!-- Divider after NLB -->
    <div class="menu-item" onclick="checkConnectionAndRedirect('cluster', event)">
        <img id="cluster-img" src="./images/left-menu/cluster.png" alt="Cluster Icon">
        <div class="menu-text">Cluster</div>
    </div>
    <div class="divider"></div> <!-- Divider after Cluster -->
    <div class="menu-item" onclick="checkConnectionAndRedirect('s3', event)">
        <img id="s3-img" src="./images/left-menu/s3.png" alt="S3 Icon">
        <div class="menu-text">S3</div>
    </div>
    <div class="menu-item" onclick="checkConnectionAndRedirect('filesystem', event)">
        <img id="filesystem-img" src="./images/left-menu/filesystem.png" alt="FileSystem Icon" onerror="this.src='./images/left-menu/disk.png'">
        <div class="menu-text">FS (WIP)</div>
    </div>
    <div class="menu-item" onclick="checkConnectionAndRedirect('rdbms', event)">
        <img id="rdbms-img" src="./images/left-menu/disk.png" alt="RDBMS Icon">
        <div class="menu-text">RDBMS</div>
    </div>
    <div class="divider"></div> <!-- Divider after RDBMS -->
    <div class="menu-item" onclick="checkConnectionAndRedirect('topology', event)">
        <img id="topology-img" src="./images/left-menu/vpc.png" alt="Topology Icon">
        <div class="menu-text">Topology</div>
    </div>
</body>
</html>
